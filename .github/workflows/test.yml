name: Validate junior-high SET
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate 23 scenes, 11 questions and code
        run: node --test tests/scenes.test.cjs
